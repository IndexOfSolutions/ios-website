name: Deploy Next.js to Azure App Service

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          # Add your NEXT_PUBLIC_ vars here if you have any

      - name: Prepare standalone deployment package
        run: |
          cp -r .next/standalone/. ./deploy

          mkdir -p ./deploy/.next/static
          cp -r .next/static/. ./deploy/.next/static

          # FIXED: use /. to copy contents, not the directory itself
          mkdir -p ./deploy/public
          cp -r public/. ./deploy/public/

          cat > ./deploy/oryx-manifest.toml << 'EOF'
          compressedNodeModulesFile=""
          EOF

          echo '[config]' > ./deploy/.deployment
          echo 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' >> ./deploy/.deployment
      
      - name: Verify deployment structure
        run: |
          echo "=== Deploy root ==="
          ls -la ./deploy/

          echo "=== .next/static ==="
          ls ./deploy/.next/static | head -5

          echo "=== public ==="
          ls ./deploy/public/

          # Hard fail if nested public exists
          if [ -d "./deploy/public/public" ]; then
            echo "❌ Nested public/public detected!"
            exit 1
          fi

          echo "✅ Structure looks clean"

      - name: Zip deployment package
        run: |
          cd deploy
          zip -r ${{ github.workspace }}/deploy.zip .

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'IOSWebsite'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/deploy.zip